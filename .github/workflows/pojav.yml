name: Pojav mods

# Собирает папку pojav/mods (TrailCraft + Create, Ponder, Flywheel, Registrate) и коммитит её в main,
# если jar изменились. Коммит токеном GITHUB_TOKEN новых запусков не вызывает.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['src/**', 'build.gradle', 'gradle.properties', 'settings.gradle']

permissions:
  contents: write

concurrency:
  group: pojav-mods
  cancel-in-progress: false

jobs:
  pojav:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Collect mods
        run: ./gradlew pojavMods

      - name: Commit pojav/mods
        run: |
          git add -A pojav/mods
          if git diff --cached --quiet; then
            echo "pojav/mods не изменилась"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git commit -m "Обновлена папка модов для PojavLauncher"
          git pull --rebase origin main
          git push origin HEAD:main
